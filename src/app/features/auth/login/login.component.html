<div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 mt-10">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Log in to LifeLink Lanka</h2>

  @if (errorMessage()) {
    <div class="bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email" [(ngModel)]="email" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" name="password" [(ngModel)]="password" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
    </div>

    <button type="submit" [disabled]="loading()"
            class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-medium py-2.5 rounded-lg transition">
      {{ loading() ? 'Logging in...' : 'Log In' }}
    </button>
  </form>

  <p class="text-sm text-gray-500 mt-4 text-center">
    Don't have an account? <a routerLink="/register" class="text-red-600 font-medium hover:underline">Register as a donor</a>
  </p>
</div>
