<div class="max-w-2xl mx-auto space-y-6">

  <div>
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold uppercase tracking-widest text-red-600 bg-red-50 px-2.5 py-0.5 rounded-full">
        Hospital Staff Portal
      </span>
    </div>
    <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">Broadcast Emergency Blood Need</h1>
    <p class="text-xs sm:text-sm text-slate-500">Submitting this request will automatically match eligible donors in Sri Lanka and broadcast a real-time SignalR alert to voluntary donors.</p>
  </div>

  <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
    @if (errorMessage()) {
      <div class="bg-red-50 text-red-700 text-xs rounded-2xl px-4 py-3 mb-6 border border-red-200">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-5 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1">Requesting Hospital Facility</label>
        <select [(ngModel)]="hospitalId" name="hospitalId" required
                class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-red-500">
          @for (h of hospitals(); track h.id) {
            <option [value]="h.id">{{ h.name }} ({{ h.district }})</option>
          }
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Blood Group Needed</label>
          <select [(ngModel)]="bloodTypeNeeded" name="bloodTypeNeeded"
                  class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-red-500">
            @for (bt of bloodTypes; track bt) {
              <option [value]="bt">{{ formatBloodType(bt) }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Component Needed</label>
          <select [(ngModel)]="componentNeeded" name="componentNeeded"
                  class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-red-500">
            @for (c of components; track c) {
              <option [value]="c">{{ formatComponentType(c) }}</option>
            }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Units (Bags) Needed</label>
          <input type="number" min="1" max="50" [(ngModel)]="unitsNeeded" name="unitsNeeded" required
                 class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-red-500 font-bold" />
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Urgency Level</label>
          <select [(ngModel)]="urgency" name="urgency"
                  class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-red-500 font-bold">
            @for (u of urgencyLevels; track u) {
              <option [value]="u">{{ u === 'Critical' ? '🚨 Critical (Immediate Code Red)' : (u === 'Urgent' ? '⚠️ Urgent (Within 8 Hours)' : 'Standard / Scheduled') }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Clinical Indication / Diagnosis</label>
        <select [(ngModel)]="clinicalIndication" name="clinicalIndication"
                class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-red-500">
          @for (ind of commonIndications; track ind) {
            <option [value]="ind">{{ ind }}</option>
          }
        </select>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Patient Context & Ward Details</label>
        <textarea [(ngModel)]="patientContext" name="patientContext" rows="3" required
                  class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-red-500"
                  placeholder="e.g. 34yo female in ICU Ward 4 following emergency cesarean section with uterine atony. Direct transfusion protocol active."></textarea>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Required By (Deadline)</label>
        <input type="datetime-local" [(ngModel)]="neededByUtc" name="neededByUtc" required
               class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-red-500" />
      </div>

      <div class="pt-4 flex gap-4">
        <button type="button" routerLink="/blood-requests" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition">
          Cancel
        </button>
        <button type="submit" [disabled]="loading()"
                class="flex-1 bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-200 text-sm">
          {{ loading() ? 'Broadcasting SOS...' : 'Broadcast Emergency Request' }}
        </button>
      </div>
    </form>
  </div>

</div>
