<div class="max-w-lg">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Raise a Blood Request</h1>

  @if (errorMessage()) {
    <div class="bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">{{ errorMessage() }}</div>
  }

  @if (hospitals().length === 0) {
    <div class="bg-yellow-50 text-yellow-700 text-sm rounded-lg px-4 py-3 mb-4">
      No verified hospitals found. Register a hospital first and wait for admin approval.
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="bg-white rounded-xl shadow p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Hospital</label>
      <select name="hospitalId" [(ngModel)]="hospitalId" required
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none">
        <option value="" disabled selected>Select a verified hospital</option>
        @for (h of hospitals(); track h.id) {
          <option [value]="h.id">{{ h.name }} ({{ h.district }})</option>
        }
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Blood Type Needed</label>
        <select name="bloodTypeNeeded" [(ngModel)]="bloodTypeNeeded" required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none">
          @for (bt of bloodTypes; track bt) {
            <option [value]="bt">{{ formatBloodType(bt) }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Units Needed</label>
        <input type="number" name="unitsNeeded" [(ngModel)]="unitsNeeded" min="1" max="50" required
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Urgency</label>
      <select name="urgency" [(ngModel)]="urgency" required
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none">
        @for (u of urgencyLevels; track u) {
          <option [value]="u">{{ u }}</option>
        }
      </select>
      <p class="text-xs text-gray-400 mt-1">"Critical" broadcasts an instant real-time alert to all matching donors</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Patient Context</label>
      <textarea name="patientContext" [(ngModel)]="patientContext" rows="2" required
                placeholder="e.g. Road traffic accident trauma patient, Ward 4"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Needed By</label>
      <input type="datetime-local" name="neededByUtc" [(ngModel)]="neededByUtc" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
    </div>

    <button type="submit" [disabled]="loading()"
            class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-medium py-2.5 rounded-lg transition">
      {{ loading() ? 'Creating...' : 'Create Request' }}
    </button>
  </form>
</div>
