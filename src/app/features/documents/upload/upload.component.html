<div class="max-w-lg">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Upload a Document</h1>

  @if (publicUrl()) {
    <div class="bg-green-50 text-green-700 text-sm rounded-lg px-4 py-3 mb-4">
      Uploaded successfully!
      <a [href]="publicUrl()" target="_blank" class="underline font-medium">View file</a>
    </div>
  }
  @if (errorMessage()) {
    <div class="bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">{{ errorMessage() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="bg-white rounded-xl shadow p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Document Type</label>
      <select name="documentType" [(ngModel)]="documentType" required
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none">
        <option value="NIC">National Identity Card</option>
        <option value="MedicalCertificate">Medical Certificate</option>
        <option value="HospitalLicense">Hospital License</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">File (PDF, JPEG, or PNG — max 10MB)</label>
      <input type="file" (change)="onFileSelected($event)" accept=".pdf,.jpg,.jpeg,.png" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
    </div>

    <button type="submit" [disabled]="loading()"
            class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-medium py-2.5 rounded-lg transition">
      {{ loading() ? 'Uploading...' : 'Upload' }}
    </button>
  </form>
</div>
