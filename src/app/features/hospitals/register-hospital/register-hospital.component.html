<div class="max-w-lg">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Register a Hospital</h1>

  @if (successMessage()) {
    <div class="bg-green-50 text-green-700 text-sm rounded-lg px-4 py-3 mb-4">{{ successMessage() }}</div>
  }
  @if (errorMessage()) {
    <div class="bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">{{ errorMessage() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="bg-white rounded-xl shadow p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Hospital Name</label>
      <input type="text" name="name" [(ngModel)]="name" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Ministry of Health Registration Number</label>
      <input type="text" name="registrationNumber" [(ngModel)]="registrationNumber" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">District</label>
      <input type="text" name="district" [(ngModel)]="district" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
      <textarea name="address" [(ngModel)]="address" rows="2" required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Contact Phone</label>
      <input type="text" name="contactPhone" [(ngModel)]="contactPhone" required placeholder="0112691111"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500 focus:outline-none" />
    </div>

    <button type="submit" [disabled]="loading()"
            class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-medium py-2.5 rounded-lg transition">
      {{ loading() ? 'Submitting...' : 'Submit for Verification' }}
    </button>
  </form>
</div>
