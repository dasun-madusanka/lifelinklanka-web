<div>
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Pending Hospital Verifications</h1>

  @if (pendingHospitals().length === 0) {
    <p class="text-gray-400">No hospitals awaiting verification.</p>
  } @else {
    <div class="space-y-4">
      @for (h of pendingHospitals(); track h.id) {
        <div class="bg-white rounded-xl shadow p-5 flex items-center justify-between">
          <div>
            <p class="font-semibold text-gray-800">{{ h.name }}</p>
            <p class="text-sm text-gray-500">{{ h.district }} · Reg#: {{ h.registrationNumber }} · {{ h.contactPhone }}</p>
            <p class="text-xs text-gray-400">{{ h.address }}</p>
          </div>
          <div class="flex gap-2">
            <button (click)="verify(h.id, true)" class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded-lg">
              Approve
            </button>
            <button (click)="verify(h.id, false)" class="bg-red-100 hover:bg-red-200 text-red-700 text-sm px-4 py-2 rounded-lg">
              Reject
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
