<div>
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Manage Users</h1>

  <div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-left">
        <tr>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">Email</th>
          <th class="px-4 py-3">District</th>
          <th class="px-4 py-3">MFA</th>
          <th class="px-4 py-3">Status</th>
          <th class="px-4 py-3">Assign Role</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody>
        @for (u of users(); track u.id) {
          <tr class="border-t">
            <td class="px-4 py-3">{{ u.fullName }}</td>
            <td class="px-4 py-3">{{ u.email }}</td>
            <td class="px-4 py-3">{{ u.district }}</td>
            <td class="px-4 py-3">{{ u.isMfaEnabled ? '✅' : '—' }}</td>
            <td class="px-4 py-3">
              @if (u.isActive) {
                <span class="text-green-600 font-medium">Active</span>
              } @else {
                <span class="text-red-600 font-medium">Suspended</span>
              }
            </td>
            <td class="px-4 py-3">
              <div class="flex gap-2">
                <select [(ngModel)]="selectedRole[u.id]" class="border border-gray-300 rounded px-2 py-1 text-xs">
                  <option value="" disabled selected>Select role</option>
                  @for (r of roles; track r) {
                    <option [value]="r">{{ r }}</option>
                  }
                </select>
                <button (click)="assignRole(u.id)" class="text-xs bg-gray-800 text-white px-2 py-1 rounded">Set</button>
              </div>
            </td>
            <td class="px-4 py-3">
              <button (click)="toggleActive(u.id)" class="text-xs px-3 py-1.5 rounded"
                      [ngClass]="u.isActive ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'">
                {{ u.isActive ? 'Suspend' : 'Activate' }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
