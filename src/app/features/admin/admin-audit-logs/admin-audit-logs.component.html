<div>
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Audit Logs</h1>

  <div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-left">
        <tr>
          <th class="px-4 py-3">Timestamp</th>
          <th class="px-4 py-3">Action</th>
          <th class="px-4 py-3">Details</th>
          <th class="px-4 py-3">IP Address</th>
        </tr>
      </thead>
      <tbody>
        @for (log of logs(); track log.id) {
          <tr class="border-t">
            <td class="px-4 py-3 text-gray-500">{{ log.createdAtUtc | date:'medium' }}</td>
            <td class="px-4 py-3 font-medium text-gray-800">{{ log.action }}</td>
            <td class="px-4 py-3 text-gray-500">{{ log.details || '—' }}</td>
            <td class="px-4 py-3 text-gray-400">{{ log.ipAddress || '—' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
